[package]
name = "linear-cli-rs"
version = "0.3.0"
edition = "2024"
description = "Fast, zero-config CLI for Linear — issues, sub-issues, comments, search, and raw GraphQL"
license = "MIT"
repository = "https://github.com/adrianhelvik/linear-cli-rs"
readme = "README.md"
keywords = ["linear", "cli", "issue-tracker", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "linear"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
crossterm = "0.25"
dirs = "5"
inquire = "0.7"
rpassword = "7"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.16", features = ["ansi"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
chrono = "0.4.44"
